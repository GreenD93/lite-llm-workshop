# 워크샵의 CloudFront behavior 재현: 하나의 도메인에서 경로로 분기한다.
#   /auth/*  → Key Vending Broker
#   그 외    → LiteLLM (API + Admin UI)
server {
    listen 80;
    client_max_body_size 50m;

    location /auth/ {
        proxy_pass http://broker:8000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://litellm:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 스트리밍 응답(SSE)을 버퍼링 없이 바로 흘려보내고, 긴 생성에도 끊지 않는다.
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
